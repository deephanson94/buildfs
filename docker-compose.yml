version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    depends_on:
      - redis

  worker:
    build: ./backend
    command: python -m app.worker
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./backend/models:/app/models
    depends_on:
      - redis
      - backend

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - ./backend/data:/usr/share/nginx/html/data

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  data:
